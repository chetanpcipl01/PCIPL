<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* Loader Style */
        #loader-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0d6efd;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Fullscreen iFrame Style */
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: none; /* Starting me hide rahega */
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader-container">
        <div class="loader"></div>
        <p style="margin-top:15px; color:#555;">Opening Application...</p>
    </div>

    <!-- App Screen (iFrame) -->
    <iframe id="appFrame"></iframe>

    <script>
        // Google Doc ID
        const docId = "19bEbx27PWmmXLKS2nDXk7IsHGxlET2ZIzM-dvb2_x-A";
        const docTextUrl = `https://docs.google.com/document/d/${docId}/export?format=txt`;

        fetch(docTextUrl)
            .then(res => res.text())
            .then(targetUrl => {
                const cleanUrl = targetUrl.trim();
                if (cleanUrl.startsWith("http")) {
                    const iframe = document.getElementById("appFrame");
                    const loader = document.getElementById("loader-container");
                    
                    // iFrame me Google Apps Script load karein
                    iframe.src = cleanUrl;
                    
                    // App load hote hi loader hata kar iframe dikhayein
                    iframe.onload = function() {
                        loader.style.display = "none";
                        iframe.style.display = "block";
                    };
                } else {
                    document.getElementById("loader-container").innerHTML = "Invalid URL Contact Procure Consultancy India Pvt Ltd";
                }
            })
            .catch(err => {
                document.getElementById("loader-container").innerHTML = "Error fetching app link.";
            });
    </script>
</body>
</html>
