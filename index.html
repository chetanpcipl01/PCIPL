<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading App...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #ffffff;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0d6efd;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <p style="margin-top:15px; color:#555;">Opening Application...</p>
    </div>

    <script>
        // Google Doc ID
        const docId = "19bEbx27PWmmXLKS2nDXk7IsHGxlET2ZIzM-dvb2_x-A";
        const docTextUrl = `https://docs.google.com/document/d/${docId}/export?format=txt`;

        fetch(docTextUrl)
            .then(res => res.text())
            .then(targetUrl => {
                const cleanUrl = targetUrl.trim();
                if (cleanUrl.startsWith("http")) {
                    window.location.replace(cleanUrl);
                } else {
                    document.body.innerHTML = "Invalid URL inside Google Doc.";
                }
            })
            .catch(err => {
                document.body.innerHTML = "Error fetching app link.";
            });
    </script>
</body>
</html>
