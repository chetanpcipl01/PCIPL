<!DOCTYPE html>
<html lang="hi">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { 
        margin: 0;
        padding: 0;
        min-height: 100vh;
        position: relative;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Base Background (Login screen par NO Blur) */
      body::before {
        content: '';
        position: fixed;
        top: -15px;
        left: -15px;
        right: -15px;
        bottom: -15px;
        background: linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.15)), 
                    url('https://drive.google.com/thumbnail?id=1BGe259M4_owLDxpsxfHzu12BMo1mp9mI&sz=w1920') no-repeat center center fixed;
        background-size: cover;
        filter: blur(0px); /* डिफ़ॉल्ट रूप से ब्लर नहीं रहेगा */
        transition: filter 0.4s ease; /* स्मूथ ट्रांजिशन */
        z-index: -1;
      }

      /* Login hone ke baad BG Blur hoga */
      body.logged-in::before {
        filter: blur(8px);
      }

      /* Login Section - Box को Bottom में सेट करने के लिए */
      #loginSection {
        display: flex;
        justify-content: center;
        align-items: flex-end; /* 👈 Flex-end से कार्ड बॉटम में शिफ्ट होगा */
        min-height: 100vh;       
        padding-bottom: 50px;  /* 👈 नीचे से गैप (इसे कम-ज्यादा कर सकते हैं) */
        padding-top: 20px;
        padding-left: 20px;
        padding-right: 20px;
      }

      /* Outer Catalog Container */
      .catalog-card-container {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        margin-top: 10px;
        margin-bottom: 30px;
      }

      /* Glass Card for Login Box */
      .login-card { 
        width: 100%;
        max-width: 420px; 
        margin: 0; 
        padding: 35px 25px; 
        background: rgba(255, 255, 255, 0.35) !important;
        backdrop-filter: blur(14px) !important;
        -webkit-backdrop-filter: blur(14px) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.7) !important;
        box-shadow: 0 8px 32px 0 rgba(92, 19, 29, 0.15) !important;
        border-radius: 20px !important;
      }

      /* Pure Glass View for Input & Search Boxes */
      .form-control, #mobileInput, #searchInput {
        background: rgba(255, 255, 255, 0.25) !important;
        backdrop-filter: blur(10px) !important;
        -webkit-backdrop-filter: blur(10px) !important;
        border: 1.5px solid rgba(92, 19, 29, 0.3) !important;
        color: #3d1b13 !important;
        font-weight: 600;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05) !important;
      }

      .form-control:focus, #mobileInput:focus, #searchInput:focus {
        background: rgba(255, 255, 255, 0.5) !important;
        border-color: #5c131d !important;
        box-shadow: 0 0 12px rgba(92, 19, 29, 0.3) !important;
        outline: none !important;
      }

      /* Override Mobile Autofill Background */
      #mobileInput:-webkit-autofill,
      #mobileInput:-webkit-autofill:hover, 
      #mobileInput:-webkit-autofill:focus,
      #searchInput:-webkit-autofill {
        -webkit-text-fill-color: #3d1b13 !important;
        -webkit-box-shadow: 0 0 0px 1000px rgba(255, 255, 255, 0.35) inset !important;
        transition: background-color 5000s ease-in-out 0s;
      }

      #mobileInput {
        text-align: center !important;
        letter-spacing: 1px;
      }

      #mobileInput::placeholder, #searchInput::placeholder {
        color: #7a5e55;
        font-weight: normal;
      }

      /* Royal Maroon Buttons */
      .btn-theme {
        background: linear-gradient(135deg, #6b1523, #420c13) !important;
        color: #ffffff !important;
        border: none !important;
        font-weight: 600;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 14px rgba(92, 19, 29, 0.35) !important;
        transition: all 0.3s ease !important;
      }

      .btn-theme:hover {
        background: linear-gradient(135deg, #520f1a, #2b070c) !important;
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(92, 19, 29, 0.45) !important;
      }

      /* Product Card - Glass Blur Effect */
      .product-card { 
        background: rgba(255, 255, 255, 0.28) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.7) !important;
        border-radius: 18px !important;
        box-shadow: 0 8px 24px rgba(92, 19, 29, 0.12) !important;
        transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease; 
        height: 100%; 
        overflow: hidden;
      }

      .product-card .card-body {
        background: transparent !important;
      }

      .product-card:hover { 
        transform: translateY(-5px);
        box-shadow: 0 14px 30px rgba(92, 19, 29, 0.22) !important; 
        background: rgba(255, 255, 255, 0.42) !important;
      }

      /* Transparent Product Image Container */
      .product-img { 
        height: 190px; 
        object-fit: contain; 
        padding: 12px; 
        background: rgba(255, 255, 255, 0.15) !important; 
        border-bottom: 1px solid rgba(92, 19, 29, 0.1) !important;
      }

      /* Typography & Colors */
      .text-theme {
        color: #5c131d !important;
      }

      .price-tag { 
        font-size: 1.15rem; 
        font-weight: 700; 
        color: #198754; 
      }

      .details-list { 
        font-size: 0.85rem; 
        margin-bottom: 0; 
        padding-left: 0; 
        list-style: none; 
      }

      .details-list li { 
        border-bottom: 1px solid rgba(92, 19, 29, 0.12); 
        padding: 5px 0; 
        color: #3d1b13;
      }

      .balance-text {
        font-size: 1.05rem;
        font-weight: 700;
        color: #8b1e2d;
      }

      /* Mobile Responsive Adjustments */
      @media (max-width: 576px) {
        .header-title {
          font-size: 1.35rem;
          text-align: center;
          width: 100%;
        }
        .user-info-bar {
          width: 100%;
          justify-content: flex-end;
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>

    <!-- SECTION 1: LOGIN PAGE -->
    <div id="loginSection" class="container">
      <div class="login-card text-center">
        <h4 class="mb-2 fw-bold text-theme"></h4>
        <p class="text-muted small mb-4"></p>
        
        <form onsubmit="event.preventDefault(); handleLogin();">
          <div class="mb-3">
            <input type="tel" id="mobileInput" class="form-control form-control-lg shadow-sm" placeholder="ENTER MOBILE NO" autocomplete="tel">
          </div>
          <button type="submit" id="loginBtn" class="btn btn-theme btn-lg w-100">Login</button>
        </form>
        <div id="loginError" class="text-danger mt-3 small" style="display: none;"></div>
      </div>
    </div>

    <!-- SECTION 2: PRODUCT CATALOG PAGE -->
    <div id="catalogSection" class="container catalog-card-container p-3 p-md-4" style="display: none;">
      <!-- Mobile Responsive Header -->
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom gap-2" style="border-color: rgba(92, 19, 29, 0.2) !important;">
        <div>
          <!-- कस्टमर का नाम -->
          <h3 id="customerHeaderName" class="m-0 fw-bold header-title text-theme"></h3>
          <!-- कस्टमर का बैलेंस -->
          <div id="customerBalance" class="balance-text mt-1"></div>
        </div>
        <div class="d-flex align-items-center gap-2 user-info-bar">
          <button class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold" onclick="handleLogout()">Logout</button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="row justify-content-center mb-4">
        <div class="col-12 col-md-8">
          <input type="text" id="searchInput" class="form-control form-control-lg shadow-sm rounded-pill px-4 text-center text-md-start" placeholder="Search Product" oninput="debounceSearch()">
        </div>
      </div>

      <!-- Search Loader -->
      <div id="loading" class="text-center my-4" style="display: none;">
        <div class="spinner-border text-theme" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-theme fw-semibold">Searching items...</p>
      </div>

      <!-- Items Grid -->
      <div id="productGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
        <div class="col-12 text-center text-muted fs-6 mt-4 fw-semibold" style="color: #5c131d !important;">
          <!-- 🔍 Please type item name or code above to search products.-->
        </div>
      </div>
    </div>

    <script>
      let searchTimeout = null;

      // Handle Login
      function handleLogin() {
        const mobileInput = document.getElementById('mobileInput');
        const loginBtn = document.getElementById('loginBtn');
        const errDiv = document.getElementById('loginError');
        const mobile = mobileInput.value.trim();
        
        errDiv.style.display = 'none';

        if(!mobile) {
          errDiv.innerText = "Please enter a valid mobile number!";
          errDiv.style.display = 'block';
          return;
        }

        loginBtn.disabled = true;
        loginBtn.innerText = "Logging in...";

        google.script.run
          .withSuccessHandler(function(res) {
            loginBtn.disabled = false;
            loginBtn.innerText = "Login";

            if(res && res.success) {
              // लॉगिन होने पर बैकग्राउंड ब्लर क्लास लागू करें
              document.body.classList.add('logged-in');

              document.getElementById('loginSection').style.setProperty('display', 'none', 'important');
              document.getElementById('catalogSection').style.display = 'block';
              
              document.getElementById('customerHeaderName').innerText = "👤 " + (res.customerName || "Customer");
              document.getElementById('customerBalance').innerText = "Bal : " + (res.balance || "0.00");
            } else {
              errDiv.innerText = res ? res.message : "Invalid credentials.";
              errDiv.style.display = 'block';
            }
          })
          .withFailureHandler(function(err) {
            loginBtn.disabled = false;
            loginBtn.innerText = "Login";
            errDiv.innerText = "Error: " + (err.message || "Unable to reach server");
            errDiv.style.display = 'block';
          })
          .checkLogin(mobile);
      }

      // Handle Logout
      function handleLogout() {
        // लॉगआउट होने पर बैकग्राउंड ब्लर हटा दें
        document.body.classList.remove('logged-in');

        document.getElementById('mobileInput').value = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('customerHeaderName').innerText = '';
        document.getElementById('customerBalance').innerText = '';

        document.getElementById('productGrid').innerHTML = '<div class="col-12 text-center text-muted fs-6 mt-4 fw-semibold" style="color: #5c131d !important;">🔍 search products</div>';

        document.getElementById('catalogSection').style.display = 'none';
        document.getElementById('loginSection').style.setProperty('display', 'flex', 'important');
      }

      // Debounce Search Input
      function debounceSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(executeSearch, 400);
      }

      // Execute Search
      function executeSearch() {
        const query = document.getElementById('searchInput').value.trim();
        const grid = document.getElementById('productGrid');
        const loader = document.getElementById('loading');

        if(query.length < 2) {
          grid.innerHTML = '<div class="col-12 text-center text-muted fs-6 mt-4 fw-semibold" style="color: #5c131d !important;">🔍 search products</div>';
          loader.style.display = 'none';
          return;
        }

        loader.style.display = 'block';

        google.script.run
          .withSuccessHandler(renderCards)
          .withFailureHandler(function(err) {
            loader.style.display = 'none';
            alert("Error searching products: " + err.message);
          })
          .searchProducts(query);
      }

      // Helper to Sanitize Text to Prevent XSS
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // Render Cards (With Stock Status Included)
      function renderCards(products) {
        document.getElementById('loading').style.display = 'none';
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        if(!products || products.length === 0) {
          grid.innerHTML = '<div class="col-12 text-center mt-4 fw-semibold" style="color: #5c131d !important;">No matching items found.</div>';
          return;
        }

        let htmlBuffer = '';

        products.forEach(p => {
          const stock = Number(p.stock) || 0;
          const stockColor = stock > 0 ? "text-success" : "text-danger";
          const stockText = stock > 0 ? "In Stock: " + stock : "Out of Stock";
          const fallbackImage = 'https://via.placeholder.com/200?text=No+Image';

          const name = escapeHtml(p.name);
          const code = escapeHtml(p.code);
          const group = escapeHtml(p.group);
          const hsn = escapeHtml(p.hsn);
          const gst = escapeHtml(p.gst);
          const pkd = escapeHtml(p.pkd);
          const mrp = escapeHtml(p.mrp);
          const image = p.image ? escapeHtml(p.image) : fallbackImage;

          htmlBuffer += `
            <div class="col">
              <div class="card product-card">
                <img src="${image}" class="card-img-top product-img" alt="${name}" onerror="this.src='${fallbackImage}'">
                <div class="card-body p-3">
                  <h6 class="card-title text-truncate fw-bold text-theme" title="${name}">${name}</h6>
                  <p class="price-tag mb-1">MRP: ₹${mrp}</p>
                  <p class="fw-bold ${stockColor} mb-2 small">${stockText}</p>
                  
                  <ul class="details-list">
                    <li><b>Code:</b> ${code}</li>
                    <!-- 🔍 Please type item name or code above to search products.-->
                     <!--<li><b>Group:</b> ${group}</li>
                    <li><b>HSN:</b> ${hsn}</li>
                    <li><b>GST:</b> ${gst}%</li>
                    <li><b>PKD Qty:</b> ${pkd}</li>-->
                  </ul>
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = htmlBuffer;
      }
    </script>
  </body>
</html>
